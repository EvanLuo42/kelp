# Publishes a release when a tag such as v0.2.0 is pushed. Before tagging,
# set the version in Cargo.toml (the workspace version and every kelp-*
# workspace dependency) and give the version a section in CHANGELOG.md.
#
# Needs a CARGO_REGISTRY_TOKEN secret in the crates-io environment.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  prepare:
    name: Check the version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "kelp-server") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - name: Extract the release notes
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  ci:
    name: Check that CI passed on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Look for a successful CI run
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA; push the commit to a branch and wait for it first"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish to crates.io
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Publishes only the crates that are not on crates.io yet, so a failed
      # run can be re-run. crates.io limits how many new crates can be published
      # in a short time (HTTP 429), so wait and retry while crates are left.
      - name: Publish
        run: |
          set -o pipefail
          for attempt in $(seq 1 15); do
            args=()
            while read -r name version; do
              status=$(curl -s -o /dev/null -w '%{http_code}' \
                -A "kelp-release (https://github.com/$GITHUB_REPOSITORY)" \
                "https://crates.io/api/v1/crates/$name/$version")
              [ "$status" = 200 ] || args+=(-p "$name")
            done < <(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name != "kelp-testkit") | "\(.name) \(.version)"')
            if [ ${#args[@]} -eq 0 ]; then
              echo "Everything is published"
              exit 0
            fi
            echo "Publishing: ${args[*]}"
            if ! cargo publish --locked "${args[@]}" 2>&1 | tee publish.log; then
              grep -q '429' publish.log || exit 1
              sleep 600
            fi
          done
          echo "::error::some crates are still not published"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
