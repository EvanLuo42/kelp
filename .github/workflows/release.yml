# Publishes a release when a tag such as v0.2.0 is pushed: the crates go to
# crates.io, and the GitHub Release gets release builds of kelp, kelpd and
# kelp-server for Linux and Windows. Before tagging, set the version in
# Cargo.toml (the workspace version and every kelp-* workspace dependency),
# give the version a section in CHANGELOG.md and wait for CI to pass on the
# commit to tag.
#
# Needs a CARGO_REGISTRY_TOKEN secret in the crates-io environment.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  prepare:
    name: Check the version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "kelp-server") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - name: Extract the release notes
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  ci:
    name: Check that CI passed on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Look for a successful CI run
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA; push the commit to a branch and wait for it first"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build binaries (${{ matrix.target }})
    needs: [prepare, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p kelp-cli -p kelp-server
      - name: Check that the binaries run
        shell: bash
        run: |
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          for bin in kelp kelpd kelp-server; do
            "target/release/$bin$ext" --version
          done
      - name: Package
        shell: bash
        run: |
          name="kelp-$GITHUB_REF_NAME-${{ matrix.target }}"
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir "$name"
          for bin in kelp kelpd kelp-server; do
            cp "target/release/$bin$ext" "$name/"
          done
          cp README.md LICENSE-APACHE LICENSE-MIT "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "asset=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "asset=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ env.asset }}

  publish:
    name: Publish to crates.io
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Publishes only the crates that are not on crates.io yet, so a failed
      # run can be re-run. crates.io limits how many new crates can be published
      # in a short time (HTTP 429), so wait and retry while crates are left.
      - name: Publish
        run: |
          set -o pipefail
          for attempt in $(seq 1 15); do
            args=()
            while read -r name version; do
              status=$(curl -s -o /dev/null -w '%{http_code}' \
                -A "kelp-release (https://github.com/$GITHUB_REPOSITORY)" \
                "https://crates.io/api/v1/crates/$name/$version")
              [ "$status" = 200 ] || args+=(-p "$name")
            done < <(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name != "kelp-testkit") | "\(.name) \(.version)"')
            if [ ${#args[@]} -eq 0 ]; then
              echo "Everything is published"
              exit 0
            fi
            echo "Publishing: ${args[*]}"
            if ! cargo publish --locked "${args[@]}" 2>&1 | tee publish.log; then
              grep -q '429' publish.log || exit 1
              sleep 600
            fi
          done
          echo "::error::some crates are still not published"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create the GitHub Release
    needs: [publish, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the release
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
        env:
          GH_TOKEN: ${{ github.token }}
