[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EvanLuo42/kelp"
homepage = "https://github.com/EvanLuo42/kelp"
readme = "README.md"
keywords = ["vcs", "version-control", "gamedev"]
categories = ["development-tools"]

[workspace.dependencies]
kelp-client = { version = "0.1.0", path = "crates/kelp-client" }
kelp-daemon = { version = "0.1.0", path = "crates/kelp-daemon" }
kelp-server = { version = "0.1.0", path = "crates/kelp-server" }
kelp-core = { version = "0.1.0", path = "crates/kelp-core" }
kelp-cas = { version = "0.1.0", path = "crates/kelp-cas" }
kelp-meta = { version = "0.1.0", path = "crates/kelp-meta" }
kelp-proto = { version = "0.1.0", path = "crates/kelp-proto" }
kelp-workspace = { version = "0.1.0", path = "crates/kelp-workspace" }
kelp-vfs = { version = "0.1.0", path = "crates/kelp-vfs" }
kelp-plugin = { version = "0.1.0", path = "crates/kelp-plugin" }
kelp-prolly = { version = "0.1.0", path = "crates/kelp-prolly" }
kelp-testkit = { path = "crates/kelp-testkit" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.8", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
diffy = "0.4"
dirs = "6"
fastcdc = "3"
fd-lock = "4"
futures = "0.3"
getrandom = "0.2"
globset = "0.4"
indicatif = "0.18"
proptest = "1"
redb = "2"
quinn = "0.11"
rcgen = "0.13"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
notify = "6"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
object_store = { version = "0.12", features = ["aws"] }
postcard = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
ring = "0.17"
serde_json = "1"
wasmtime = { version = "50", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation"] }
wit-component = "0.263"
serde = { version = "1", features = ["derive"] }
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
unicode-normalization = "0.1"
walkdir = "2"
zstd = "0.13"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

# Password hashing and hashing-heavy tests are unbearably slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3
